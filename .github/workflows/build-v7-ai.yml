      - name: Download pretrained ONNX AI model (MIT experimental)
        run: |
          mkdir -p app/src/main/assets/models
          curl --fail --location --retry 3 --connect-timeout 30 \
            'https://huggingface.co/spaces/wisam99/steelbar-counter-pro/resolve/main/models/best.onnx?download=true' \
            --output app/src/main/assets/models/best.onnx
          test "$(stat -c%s app/src/main/assets/models/best.onnx)" -gt 5000000
          python - <<'PY_CHECK'
          from pathlib import Path
          p=Path('app/src/main/assets/models/best.onnx')
          print('AI model size:',p.stat().st_size,'bytes')
          PY_CHECK
      - name: Build V7 AI APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Check APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Download V7 AI APK
        uses: actions/upload-artifact@v7
        with:
          name: SteelCounterAI-V7-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
